# Inter-service communication
services:
  product-url: ${PRODUCT_SERVICE_URL:http://localhost:5002}

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      productService:
        register-health-indicator: true
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
  timelimiter:
    instances:
      productService:
        timeout-duration: 3s
